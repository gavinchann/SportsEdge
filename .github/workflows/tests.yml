name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        ml: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.ml
        run: python -m pip install -e ".[ml]"
      - run: python -m unittest discover -s tests -v
      - run: python -m sportsedge demo
      - run: python -m sportsedge run --games data/demo/games.csv --availability data/demo/availability.csv --data-kind synthetic
